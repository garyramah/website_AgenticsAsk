<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgenticsAsk</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #2563eb;
        --accent-soft: #dbeafe;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .card {
        background: var(--panel);
        border-radius: 18px;
        box-shadow: 0 20px 40px rgba(37, 99, 235, 0.08);
        max-width: 680px;
        width: calc(100% - 32px);
        padding: 48px 40px;
        text-align: center;
      }

      .badge {
        display: inline-block;
        background: var(--accent-soft);
        color: var(--accent);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 22px 0 14px;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.1;
      }

      p {
        margin: 0 auto;
        max-width: 520px;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
      }

      .cta {
        margin-top: 28px;
        display: inline-block;
        background: var(--accent);
        color: white;
        text-decoration: none;
        border-radius: 10px;
        padding: 14px 22px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">AgenticsAsk</div>
      <h1>Ask clearly. Get answers faster.</h1>
      <p>
        A simple landing page for AgenticsAsk — built to present a clean, modern,
        trustworthy experience for question-driven knowledge and AI assistance.
      </p>
      <a class="cta" href="#">Get Started</a>
    </main>
  </body>
</html>
